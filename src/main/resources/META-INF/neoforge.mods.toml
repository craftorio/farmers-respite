modLoader="javafml"
loaderVersion="${loader_version_range}"
license="${mod_license}"

[[mods]]
modId="${mod_id}"
version="${version}"
displayName="${mod_name}"
logoFile="logo.png"
logoBlur=false
credits="${mod_credits}"
authors="${mod_authors}"
description='''${mod_description}'''
itemIcon="farmersrespite:kettle"
configBackground="minecraft:textures/block/bricks.png"
# adds RecipeBookType.FARMERSRESPITE_BREWING; without it the mod fails to load
enumExtensions="META-INF/enumextensions.json"

[[mixins]]
config="farmersrespite.mixins.json"

[[dependencies.${mod_id}]]
    modId="neoforge"
    type="required"
    versionRange="[${neo_version},)"
    ordering="NONE"
    side="BOTH"

[[dependencies.${mod_id}]]
    modId="minecraft"
    type="required"
    versionRange="${minecraft_version_range}"
    ordering="NONE"
    side="BOTH"

[[dependencies.${mod_id}]]
    modId="farmersdelight"
    type="required"
    versionRange="[1.3.2,)"
    ordering="NONE"
    side="BOTH"
