plugins {
    id 'java-library'
    id 'maven-publish'
    id 'net.neoforged.moddev' version '2.0.140'
    id 'idea'
}

version = "${minecraft_version}-${mod_version}-${craftorio_version}"
group = mod_group_id

base {
    archivesName = 'FarmersRespite'
}

// Foojay downloads JDK 21 for the toolchain. Gradle itself can run on 17.
java.toolchain.languageVersion = JavaLanguageVersion.of(21)

neoForge {
    version = project.neo_version

    accessTransformers = project.files('src/main/resources/META-INF/accesstransformer.cfg')

    runs {
        client {
            client()
        }
        server {
            server()
            programArgument '--nogui'
        }
        data {
            data()
            programArguments.addAll '--mod', project.mod_id, '--all', '--output', file('src/generated/resources/').getAbsolutePath(), '--existing', file('src/main/resources/').getAbsolutePath()
        }
        configureEach {
            logLevel = org.slf4j.event.Level.INFO
        }
    }

    mods {
        "${mod_id}" {
            sourceSet(sourceSets.main)
        }
    }
}

sourceSets.main.resources {
    srcDir('src/generated/resources')
}

// Recipe JSON is already migrated for 1.21. The 1.20 datagen providers still target FinishedRecipe.
// CoffeeBushFeature and FRDamageTypes stay compiled; they run in game.
['builder', 'recipe'].each { sourceSets.main.java.exclude "umpaz/farmersrespite/data/${it}/**" }
['FRRecipes.java', 'FRLang.java', 'FRItemTags.java', 'FRBlockTags.java', 'FRDataGenerators.java', 'DatapackRegistryProvider.java'].each {
    sourceSets.main.java.exclude "umpaz/farmersrespite/data/${it}"
}
sourceSets.main.java.exclude 'umpaz/farmersrespite/data/worldgen/placement/**'
sourceSets.main.java.exclude 'umpaz/farmersrespite/data/worldgen/biome/**'
sourceSets.main.java.exclude 'umpaz/farmersrespite/data/worldgen/features/FRFeatures.java'
sourceSets.main.java.exclude 'umpaz/farmersrespite/integration/jei/**'

repositories {
    mavenCentral()
    maven {
        url = 'https://cursemaven.com'
        content { includeGroup 'curse.maven' }
    }
}

dependencies {
    // Same Farmers Delight build VanillaWorld ships (1.21.1-1.3.2). JEI sources are excluded until ported.
    implementation "curse.maven:farmers-delight-398521:${farmersdelight_file_id}"
}

tasks.withType(ProcessResources).configureEach {
    var replaceProperties = [
            minecraft_version      : minecraft_version,
            minecraft_version_range: minecraft_version_range,
            neo_version            : neo_version,
            loader_version_range   : loader_version_range,
            mod_id                 : mod_id,
            mod_name               : mod_name,
            mod_license            : mod_license,
            mod_version            : mod_version,
            mod_authors            : mod_authors,
            mod_credits            : mod_credits,
            mod_description        : mod_description,
            version                : project.version,
    ]
    inputs.properties replaceProperties
    filesMatching(['META-INF/neoforge.mods.toml', 'pack.mcmeta']) {
        expand replaceProperties
    }
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}

idea {
    module {
        downloadSources = true
        downloadJavadoc = true
    }
}
